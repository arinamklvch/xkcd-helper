services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: xkcd
    ports:
      - "5433:5432"
    volumes:
      - xkcd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d xkcd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xkcd-postgres:
