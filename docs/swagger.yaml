definitions:
  dto.LoadComic:
    properties:
      description:
        type: string
      num:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  dto.SearchComic:
    properties:
      description:
        type: string
      image_url:
        type: string
      num:
        type: integer
    type: object
info:
  contact: {}
  description: API for loading XKCD comics by number range and searching comics by
    query words.
  title: XKCD Helper API
  version: "1.0"
paths:
  /last-comic:
    get:
      description: Returns the last stored XKCD comic as a "number, title, image URL"
        object.
      produces:
      - application/json
      responses:
        "200":
          description: Last comic
          schema:
            $ref: '#/definitions/dto.SearchComic'
        "500":
          description: Failed to send JSON
          schema:
            type: string
      summary: Get last comic
      tags:
      - comics
  /load-comics:
    get:
      description: Returns XKCD comics as "number, title" strings for the requested
        range.
      parameters:
      - description: Starting comic number
        in: query
        name: from
        required: true
        type: integer
      - description: Ending comic number
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Loaded comics
          schema:
            items:
              $ref: '#/definitions/dto.LoadComic'
            type: array
        "500":
          description: Failed to send JSON
          schema:
            type: string
      summary: Load comics
      tags:
      - comics
  /login:
    post:
      consumes:
      - application/json
      description: Validates user credentials and returns a JWT token.
      parameters:
      - description: User login and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: JWT token
          schema:
            type: string
        "400":
          description: Invalid JSON data or validation error
          schema:
            type: string
        "401":
          description: Invalid login or password
          schema:
            type: string
        "500":
          description: Failed to generate token
          schema:
            type: string
      summary: Login
      tags:
      - auth
  /search-comics:
    get:
      description: Returns XKCD comics as "number, title, image URL" objects for the
        requested search query.
      parameters:
      - description: Search query words separated by spaces
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Matching comics
          schema:
            items:
              $ref: '#/definitions/dto.SearchComic'
            type: array
        "500":
          description: Failed to send JSON
          schema:
            type: string
      summary: Search comics
      tags:
      - comics
  /update:
    put:
      description: Downloads and stores new XKCD comics that are not yet present in
        the database.
      responses:
        "200":
          description: Comics updated
          schema:
            type: string
        "500":
          description: Failed to update comics
          schema:
            type: string
      summary: Update comics
      tags:
      - comics
swagger: "2.0"
