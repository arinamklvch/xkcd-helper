<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xkcd helper</title>

    <style>
        :root {
            --paper: #fffaf0;
            --paper-bright: #ffffff;
            --ink: #151515;
            --muted: #5f6670;
            --blue: #2d6cdf;
            --red: #e14b42;
            --yellow: #ffd95a;
            --line: #151515;
            --shadow: 10px 10px 0 rgba(21, 21, 21, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px;
            background:
                linear-gradient(90deg, rgba(21, 21, 21, 0.045) 1px, transparent 1px),
                linear-gradient(rgba(21, 21, 21, 0.045) 1px, transparent 1px),
                radial-gradient(circle at 18px 18px, rgba(225, 75, 66, 0.22) 2px, transparent 2px),
                #f7efe0;
            background-size: 38px 38px, 38px 38px, 24px 24px, auto;
            font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
            color: var(--ink);
        }

        .login-card {
            position: relative;
            width: min(100%, 390px);
            background: var(--paper-bright);
            padding: 34px;
            border: 3px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .login-card::before {
            content: "";
            position: absolute;
            width: 74px;
            height: 34px;
            left: 30px;
            top: -20px;
            border: 3px solid var(--line);
            background: var(--yellow);
            transform: rotate(-5deg);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: var(--ink);
            font-size: 34px;
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            text-align: center;
            color: var(--muted);
            font-size: 17px;
            font-weight: 700;
        }

        .error-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 2px solid var(--line);
            border-radius: 8px;
            background: #ffe1dc;
            color: #9f2018;
            font-size: 14px;
            font-weight: 700;
        }

        .error-message.visible {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;

            border: 2px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);

            font-size: 15px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            background: #fff;
            box-shadow: 4px 4px 0 rgba(45, 108, 223, 0.24);
        }

        button {
            width: 100%;
            padding: 13px;

            border: 2px solid var(--line);
            border-radius: 8px;

            background: var(--red);
            color: #fff;

            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--line);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: var(--blue);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--line);
        }

        @media (max-width: 560px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>xkcd searcher</h1>

        <p class="subtitle">
            Sign in to continue
        </p>

        <div id="login-error" class="error-message"></div>

        <form id="login-form">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" placeholder="Enter your login" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">
                Sign in
            </button>
        </form>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const errorBox = document.getElementById("login-error");
            errorBox.classList.remove("visible");
            errorBox.textContent = "";

            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    login: document.getElementById("login").value,
                    password: document.getElementById("password").value
                })
            });

            if (!response.ok) {
                if (response.status === 401) {
                    errorBox.textContent = "Invalid login or password.";
                } else {
                    errorBox.textContent = "Unable to sign in right now. Please try again.";
                }

                errorBox.classList.add("visible");
                return;
            }

            window.location.href = response.url;
        });
    </script>

</body>

</html>
