<!DOCTYPE html>
<html>

<head>
    <title>xkcd helper</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f2430;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 360px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #222;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .error-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fdecec;
            color: #b42318;
            font-size: 14px;
        }

        .error-message.visible {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #5568fe;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #c161a7;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #bd1590;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>xkcd searcher</h1>

        <p class="subtitle">
            Sign in to continue
        </p>

        <div id="login-error" class="error-message"></div>

        <form id="login-form">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" placeholder="Enter your login" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">
                Sign in
            </button>
        </form>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const errorBox = document.getElementById("login-error");
            errorBox.classList.remove("visible");
            errorBox.textContent = "";

            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    login: document.getElementById("login").value,
                    password: document.getElementById("password").value
                })
            });

            if (!response.ok) {
                if (response.status === 401) {
                    errorBox.textContent = "Invalid login or password.";
                } else {
                    errorBox.textContent = "Unable to sign in right now. Please try again.";
                }

                errorBox.classList.add("visible");
                return;
            }

            window.location.href = response.url;
        });
    </script>

</body>

</html>
